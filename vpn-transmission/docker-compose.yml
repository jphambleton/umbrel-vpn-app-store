version: "3.7"

# Transmission shares Gluetun's network namespace, so the Umbrel proxy (and Radarr etc.)
# talk to the *gluetun* container on port 9091 — never to the transmission container directly.

services:
  app_proxy:
    environment:
      APP_HOST: vpn-transmission_gluetun_1
      APP_PORT: 9091

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun
      # Secret files read by Gluetun at start (see README): wireguard_private_key,
      # wireguard_preshared_key, wireguard_addresses
      - ${APP_DATA_DIR}/secrets:/run/secrets:ro
    environment:
      - TZ=UTC
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      # Pick servers by country (comma-separated). Alternatives: SERVER_CITIES, SERVER_NAMES.
      - SERVER_COUNTRIES=Netherlands,Switzerland
      # AirVPN forwarded port reserved at https://airvpn.org/ports/ (must match PEERPORT below)
      - FIREWALL_VPN_INPUT_PORTS=12345        # <-- AirVPN forwarded port
      # Let the Umbrel network (app proxy, Radarr, widget) reach Transmission's web UI
      - FIREWALL_OUTBOUND_SUBNETS=10.21.0.0/16
      - DOT=on
      - BLOCK_MALICIOUS=off
      - UPDATER_PERIOD=24h
      - HEALTH_VPN_DURATION_INITIAL=30s
    restart: on-failure

  transmission:
    image: linuxserver/transmission:4.1.3@sha256:30d59b253993df8c7634fe03cbb33e22324d00d200ff3d3cc30e6184fa55f96b
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Listening port for peers — same as FIREWALL_VPN_INPUT_PORTS above
      - PEERPORT=12345                        # <-- AirVPN forwarded port
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure

  widget-server:
    image: getumbrel/umbrel-transmission-widget-server:v1.0.0@sha256:0ee30f1eecbf6f4f3f62e3f6d5c1626bd31d15ace7e97cacff5fc091836650cf
    environment:
      - TRANSMISSION_URL=http://vpn-transmission_gluetun_1
      - TRANSMISSION_PORT=9091
    restart: on-failure
